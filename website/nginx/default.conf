# nginx in front of WordPress on PHP-FPM (service "php", port 9000).
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.php;

    client_max_body_size 32m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Hidden files (.git, .env, .htaccess) and files that only reveal versions or widen the attack surface.
    location ~ /\. { deny all; }
    location ~* ^/(wp-config\.php|wp-config-docker\.php|readme\.html|license\.txt|xmlrpc\.php)$ { deny all; }
    # Uploaded files are data, never code.
    location ~* ^/wp-content/uploads/.*\.(php|phtml|phar)$ { deny all; }

    location = /favicon.ico { log_not_found off; access_log off; try_files $uri =204; }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120s;
    }

    location ~* \.(css|js|svg|png|jpe?g|gif|webp|avif|woff2?|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}
