[workspace]
resolver = "3"
members = ["crates/relay-server"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

# Pin the relay stack in one place. actix-ws is pinned here for the /v1/relay
# WebSocket channel (CONN-03, Phase 2) but no crate depends on it yet.
[workspace.dependencies]
actix-web = "4.15"
actix-ws = "0.4"
actix-http = "3"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "migrate", "macros"] }
redis = { version = "1.7", default-features = false, features = ["tokio-comp", "connection-manager"] }
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
ed25519-dalek = "3.0"
ring = "0.17"
uuid = { version = "1.26", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
base64 = "0.23"
env_logger = "0.11"
log = "0.4"
subtle = "2.6"
hex = "0.4"
