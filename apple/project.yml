# XcodeGen — sinh HandLive.xcodeproj (không commit): `cd apple && xcodegen generate`.
# Tối giản có chủ đích: không cấu hình ký (Developer ID cấu hình ở docs/deployment-guide.md).
name: HandLive
options:
  bundleIdPrefix: app.handlive
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  HLProtocol:
    path: Packages/HLProtocol
  HLCrypto:
    path: Packages/HLCrypto
  HLTransport:
    path: Packages/HLTransport
  HLDesignSystem:
    path: Packages/HLDesignSystem
targets:
  HandLive:
    type: application
    platform: macOS
    sources:
      - path: macOS/HandLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.handlive.mac
        PRODUCT_NAME: HandLive
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: HandLive
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    dependencies:
      - package: HLProtocol
      - package: HLCrypto
      - package: HLTransport
      - package: HLDesignSystem
