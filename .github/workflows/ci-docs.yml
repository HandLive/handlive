# CI của kho hub (tài liệu): khuôn tài liệu thiết kế chi tiết, và JSON Schema của kho handlive-shared
# đối chiếu với ví dụ trong docs/detailed-design. Bố cục workspace như máy dev: hub ở gốc, shared/ là
# kho handlive-shared cạnh docs/. Repo private trong group cần secret HANDLIVE_REPOS_TOKEN (đọc nội dung).
name: ci-docs

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "tools/docs/**"
      - "README.md"
      - "README.vi.md"
      - "docs/**"
      - "plans/20260925-implementation/**"
      - ".github/workflows/ci-docs.yml"
  pull_request:
    branches: [main, "feat/**"]
    paths:
      - "tools/docs/**"
      - "README.md"
      - "README.vi.md"
      - "docs/**"
      - "plans/20260925-implementation/**"
      - ".github/workflows/ci-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-policy:
    name: commit đứng tên người thật
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Không có danh tính hay trailer của công cụ AI trong commit mới
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            .githooks/check-commits.sh "$BASE..$HEAD_SHA"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            .githooks/check-commits.sh --max-count=200 "$HEAD_SHA"   # nhánh mới hoặc force-push: kiểm 200 commit gần nhất
          else
            .githooks/check-commits.sh "$BEFORE..$HEAD_SHA"
          fi

  check:
    name: tài liệu + schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve matching branches of the hub and handlive-shared
        id: refs
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.HANDLIVE_REPOS_TOKEN || github.token }}
        run: |
          resolve() {
            if git ls-remote --exit-code --heads "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/$1.git" "$BRANCH" >/dev/null 2>&1; then echo "$BRANCH"; else echo main; fi
          }
          hub="$(resolve handlive)"; shared="$(resolve handlive-shared)"
          echo "hub=$hub" >> "$GITHUB_OUTPUT"; echo "shared=$shared" >> "$GITHUB_OUTPUT"
          echo "hub → $hub, handlive-shared → $shared"

      - uses: actions/checkout@v5

      - name: Kho handlive-shared cạnh docs/
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/handlive-shared
          path: shared
          ref: ${{ steps.refs.outputs.shared }}
          token: ${{ secrets.HANDLIVE_REPOS_TOKEN || github.token }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: shared/tools/schemas/requirements.txt

      - name: Cài phụ thuộc (phiên bản ghim)
        run: python -m pip install -r shared/tools/schemas/requirements.txt

      - name: Khuôn tài liệu thiết kế chi tiết
        run: python tools/docs/validate_design_docs.py

      - name: Tài liệu song ngữ X.md / X.vi.md
        run: python tools/docs/check_bilingual_docs.py

      - name: JSON Schema + ví dụ tài liệu
        run: python shared/tools/schemas/check_schemas.py
