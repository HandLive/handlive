# CI relay: fmt + clippy + test đơn vị (không cần dịch vụ), rồi test tích hợp #[ignore]
# với PostgreSQL 16 + Redis 7 (service container). Mọi giá trị môi trường là giá trị giả của CI.
name: ci-relay

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "relay/**"
      - "shared/**"
      - ".github/workflows/ci-relay.yml"
  pull_request:
    branches: [main, "feat/**"]
    paths:
      - "relay/**"
      - "shared/**"
      - ".github/workflows/ci-relay.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v5

      # rust-version = 1.88 trong relay/Cargo.toml; stable luôn ≥ 1.88.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  integration:
    name: test tích hợp (PostgreSQL 16 + Redis 7)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: relay
    # Cổng host giống relay/docker-compose.yml (55432, 56379) để khớp relay/.env.example.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: handlive
          POSTGRES_PASSWORD: handlive-dev
          POSTGRES_DB: handlive_relay
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U handlive -d handlive_relay"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    # Giá trị giả, chỉ dùng cho CI (giống relay/.env.example); không phải secret.
    env:
      DATABASE_URL: postgres://handlive:handlive-dev@127.0.0.1:55432/handlive_relay
      REDIS_URL: redis://127.0.0.1:56379
      RELAY_JWT_SECRET: ci-only-placeholder-not-a-secret-0123456789abcdef
      RELAY_BIND: 127.0.0.1:8080
      RUST_LOG: info
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay

      - name: cargo test -- --ignored
        run: cargo test -- --ignored
