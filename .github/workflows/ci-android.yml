# CI Android: unit test JVM + Android Lint + ktlint + detekt (`./gradlew check`).
# Test đọc shared/test-vectors và shared/schemas nên shared/** cũng kích hoạt workflow này.
name: ci-android

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "android/**"
      - "shared/**"
      - ".github/workflows/ci-android.yml"
  pull_request:
    branches: [main, "feat/**"]
    paths:
      - "android/**"
      - "shared/**"
      - ".github/workflows/ci-android.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: gradlew check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # compileSdk 36 (targetSdk 35). setup-android chấp nhận license để AGP tự tải build-tools nếu thiếu.
      - name: Android SDK platform 36
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36"

      # Cache ~/.gradle (dependency, wrapper, build cache) và kiểm checksum gradle-wrapper.jar.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/feat/') }}

      - name: ./gradlew check
        run: ./gradlew check --stacktrace

      - name: Upload báo cáo test/lint khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
