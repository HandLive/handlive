# CI shared/ + tài liệu: kiểm test vector (độc lập với phía sinh), vector sinh lại byte-exact,
# JSON Schema + ví dụ trong docs/detailed-design, và khuôn tài liệu thiết kế.
name: ci-shared

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "shared/**"
      - "tools/**"
      - "docs/detailed-design/**"
      - ".github/workflows/ci-shared.yml"
  pull_request:
    branches: [main, "feat/**"]
    paths:
      - "shared/**"
      - "tools/**"
      - "docs/detailed-design/**"
      - ".github/workflows/ci-shared.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: vector + schema + tài liệu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            shared/tools/vectors/requirements.txt
            shared/tools/schemas/requirements.txt

      - name: Cài phụ thuộc (phiên bản ghim)
        run: python -m pip install -r shared/tools/vectors/requirements.txt -r shared/tools/schemas/requirements.txt

      - name: Kiểm test vector
        run: python shared/tools/vectors/verify_vectors.py

      - name: Vector sinh lại khớp byte
        run: python shared/tools/vectors/generate_vectors.py --check

      - name: JSON Schema + ví dụ tài liệu
        run: python shared/tools/schemas/check_schemas.py

      - name: Khuôn tài liệu thiết kế chi tiết
        run: python tools/docs/validate_design_docs.py
