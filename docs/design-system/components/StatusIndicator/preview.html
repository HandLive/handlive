<!-- @dsCard group="Trạng thái" height=170 subtitle="Biểu tượng tô màu trạng thái, luôn kèm chữ" -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>StatusIndicator — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block">
<style>
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, max-content)); gap: var(--space-12) var(--space-32); padding: var(--space-16); background: var(--system-background); border: 1px solid var(--separator); border-radius: var(--radius-card); font-size: 15px; line-height: 20px; }
  .pills { display: flex; flex-wrap: wrap; gap: var(--space-8); }
</style>
</head>
<body>
<div class="hl-stage">
  <div class="grid">
    <span class="status st-connected"><span class="sym fill">wifi</span>Đã kết nối qua Wi-Fi</span>
    <span class="status st-connected"><span class="sym">public</span>Đã kết nối qua Internet</span>
    <span class="status st-connecting"><span class="dot pulse"></span>Đang kết nối…</span>
    <span class="status st-offline"><span class="sym">mobile_off</span>Điện thoại ngoại tuyến · lần cuối 14:05</span>
    <span class="status st-error"><span class="sym fill">warning</span>Cần ghép nối lại</span>
    <span class="status st-live"><span class="dot pulse"></span>Đang phát camera</span>
  </div>
  <div class="hl-col">
    <span class="hl-cap">Dạng viên</span>
    <div class="pills">
      <span class="pill st-connected" style="--c: var(--status-connected)"><span class="sym fill">wifi</span>LAN</span>
      <span class="pill" style="--c: var(--status-connected)"><span class="sym">usb</span>USB</span>
      <span class="pill" style="--c: var(--status-offline)"><span class="sym">mobile_off</span>Ngoại tuyến</span>
    </div>
  </div>
</div>
</body>
</html>
