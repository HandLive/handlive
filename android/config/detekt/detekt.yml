# Chỉ ghi đè những quy tắc cần thiết; còn lại theo cấu hình mặc định của detekt.
naming:
  FunctionNaming:
    # Hàm @Composable đặt tên PascalCase theo quy ước Compose.
    ignoreAnnotated: ['Composable']

style:
  UnusedPrivateMember:
    # Hàm @Preview chỉ công cụ xem trước của Android Studio gọi tới.
    ignoreAnnotated: ['Preview']
